name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://labcup.tech/jira-notif/register
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/jira-u-bot
            git fetch origin main
            git reset --hard origin/main
            export PATH=$PATH:/usr/local/go/bin
            go build -o jira-u-bot .
            systemctl restart jira-u-bot
            sleep 2
            systemctl is-active jira-u-bot

      - name: Health check
        run: |
          curl -sf https://labcup.tech/ping -o /dev/null
          echo "jira-u-bot OK"
