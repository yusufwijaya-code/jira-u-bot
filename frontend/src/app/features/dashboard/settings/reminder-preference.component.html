<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="tier-grid">
    <label class="tier-tile" *ngFor="let opt of tierOptions; let i = index" [style.--i]="i">
      <input type="checkbox" class="visually-hidden" [formControlName]="opt.code" />
      <span class="check-box" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M20 6 9 17l-5-5" /></svg>
      </span>
      <span class="tier-text">
        <strong>{{ opt.label }}</strong>
        <small>{{ opt.hint }}</small>
      </span>
    </label>
  </div>

  <div class="card-footer">
    <div class="footer-meta">
      <span class="count-pill"><strong>{{ selectedCount }}</strong> / {{ tierOptions.length }} aktif</span>
      <button type="button" class="link-btn" (click)="setAll(true)">Pilih semua</button>
      <button type="button" class="link-btn" (click)="setAll(false)">Kosongkan</button>
    </div>
    <div class="footer-actions">
      <p class="msg" [class.success]="message && !message.isError" [class.error]="message?.isError" aria-live="polite">
        @if (message) {
          <app-icon [name]="message.isError ? 'alert-circle' : 'check-circle'" [size]="16" />
        }
        {{ message?.text }}
      </p>
      <button type="submit" class="btn btn-primary" [class.loading]="submitting" [disabled]="submitting">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Simpan Preference</span>
      </button>
    </div>
  </div>
</form>
