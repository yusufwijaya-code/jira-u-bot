# /etc/nginx/snippets/nudge-redirects.conf — included inside the labcup.tech
# server block. Nudge moved to https://nudge.labcup.tech; these keep old
# bookmarks and links in past DMs working. Everything else on labcup.tech
# belongs to other repos.
location ^~ /nudge/ {
    rewrite ^/nudge/(.*)$ https://nudge.labcup.tech/$1 permanent;
}
location = /nudge      { return 301 https://nudge.labcup.tech/dashboard; }
location ^~ /jira-notif { return 301 https://nudge.labcup.tech/dashboard; }
