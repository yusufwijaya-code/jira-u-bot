# /etc/nginx/snippets/nudge.conf — included inside the labcup.tech server block:
#     include /etc/nginx/snippets/nudge.conf;
# nginx does NOT strip /nudge: the Go app owns its full BASE_PATH.

# Backend (Go, PORT in shared/.env): JSON API, Google sign-in, admin actions.
location ~ ^/nudge/(api|auth|dashboard/admin)/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
location = /nudge/ping { proxy_pass http://127.0.0.1:8081; }

# Old jira-u-bot URLs (bookmarks, links in past DMs): the routes changed with
# the Angular rewrite, so everything lands on the dashboard (login if needed).
location ^~ /jira-notif { return 301 /nudge/dashboard; }
location = /nudge      { return 302 /nudge/dashboard; }

# Frontend (Angular build): hashed assets cached long, index.html never.
location /nudge/ {
    root /var/www/nudge/current/public;
    try_files $uri $uri/ /nudge/index.html;

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
location = /nudge/index.html {
    root /var/www/nudge/current/public;
    add_header Cache-Control "no-cache";
}
