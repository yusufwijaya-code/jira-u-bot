# /etc/nginx/sites-available/nudge.labcup.tech (symlinked into sites-enabled).
# Nudge owns the root of its own subdomain — labcup.tech itself stays free
# for other repos (see deploy/nginx-labcup-redirects.conf for the old URLs).
# Certificate: certbot certonly --nginx -d nudge.labcup.tech

server {
    listen 80;
    listen [::]:80;
    server_name nudge.labcup.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nudge.labcup.tech;

    ssl_certificate /etc/letsencrypt/live/nudge.labcup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nudge.labcup.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Backend (Go, PORT in shared/.env, BASE_PATH empty): JSON API, Google
    # sign-in, admin actions.
    location ~ ^/(api|auth|dashboard/admin)/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /ping { proxy_pass http://127.0.0.1:8081; }

    # Frontend (Angular build, baseHref "/"): hashed assets cached long,
    # index.html never.
    root /var/www/nudge/current/public/nudge;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
