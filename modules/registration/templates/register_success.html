<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi Berhasil - Jira U Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=REM:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --esb-blue: #1286e1;
        --esb-blue-dark: #0e65a9;
        --esb-blue-darker: #094371;
        --esb-blue-light: #eaf5ff;
        --esb-text: #333333;
        --esb-text-muted: #6c6c6c;
        --esb-border: #e6e6e6;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'REM', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--esb-text);
        background: radial-gradient(circle at top left, var(--esb-blue-light), #ffffff 55%);
    }

    .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 24px;
        padding: 44px 36px;
        box-shadow: 0 20px 45px -15px rgba(9, 67, 113, 0.18);
        border: 1px solid var(--esb-border);
        text-align: center;
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        animation: card-in 0.5s ease forwards;
    }

    @keyframes card-in {
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .check-badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(to right, #148ae1, #00cfab);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0);
        animation: badge-pop 0.4s ease 0.2s forwards;
    }

    @keyframes badge-pop {
        to { transform: scale(1); }
    }

    .check-badge svg { width: 30px; height: 30px; }

    h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 12px;
        color: var(--esb-blue-darker);
    }

    p {
        color: var(--esb-text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
    }

    .highlight {
        color: var(--esb-text);
        font-weight: 600;
    }

    .footer-note {
        font-size: 0.75rem;
        color: var(--esb-text-muted);
        margin-top: 28px;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="check-badge">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>Registrasi berhasil</h1>
        <p>Terima kasih, <span class="highlight">{{.Name}}</span>. Reminder Code Process untuk <span class="highlight">{{.Email}}</span> sekarang dipersonalisasi.</p>

        <p class="footer-note">ESB &middot; Jira Notification Bot</p>
    </div>
</body>
</html>
