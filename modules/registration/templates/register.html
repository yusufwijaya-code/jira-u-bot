<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Registrasi - Jira U Bot</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
        h1 { font-size: 1.25rem; }
        label { display: block; margin-top: 16px; font-weight: 600; }
        input[type=text], input[type=email] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Registrasi Jira U Bot</h1>
    <p>Daftar supaya reminder Code Process kamu dipersonalisasi dengan nama kamu.</p>
    <form method="POST" action="/register">
        <label for="name">Nama</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Jira (esb.co.id)</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Daftar</button>
    </form>
</body>
</html>
