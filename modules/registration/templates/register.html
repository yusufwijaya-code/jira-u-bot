<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrasi - Jira U Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=REM:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --esb-blue: #1286e1;
        --esb-blue-dark: #0e65a9;
        --esb-blue-darker: #094371;
        --esb-blue-light: #eaf5ff;
        --esb-orange: #eb7300;
        --esb-text: #333333;
        --esb-text-muted: #6c6c6c;
        --esb-border: #e6e6e6;
        --esb-error: #b91c1c;
        --esb-error-bg: #fdecec;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'REM', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--esb-text);
        background: radial-gradient(circle at top left, var(--esb-blue-light), #ffffff 55%);
    }

    .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 24px;
        padding: 40px 36px;
        box-shadow: 0 20px 45px -15px rgba(9, 67, 113, 0.18);
        border: 1px solid var(--esb-border);
        opacity: 0;
        transform: translateY(12px);
        animation: card-in 0.5s ease forwards;
    }

    @keyframes card-in {
        to { opacity: 1; transform: translateY(0); }
    }

    .logo {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
    }

    .logo svg { height: 32px; width: auto; }

    h1 {
        font-size: 1.4rem;
        font-weight: 700;
        text-align: center;
        margin: 0 0 8px;
        color: var(--esb-blue-darker);
    }

    .subtitle {
        text-align: center;
        color: var(--esb-text-muted);
        font-size: 0.9rem;
        margin: 0 0 28px;
        line-height: 1.5;
    }

    .alert {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--esb-error-bg);
        color: var(--esb-error);
        border: 1px solid #f3c6c6;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        line-height: 1.4;
    }

    .field { margin-bottom: 20px; }

    label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: var(--esb-text);
    }

    input[type=text], input[type=email] {
        width: 100%;
        padding: 12px 14px;
        font-size: 0.95rem;
        font-family: inherit;
        border: 1.5px solid var(--esb-border);
        border-radius: 12px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
        background: #fafafa;
    }

    input[type=text]:focus, input[type=email]:focus {
        border-color: var(--esb-blue);
        box-shadow: 0 0 0 4px rgba(18, 134, 225, 0.12);
        background: #ffffff;
    }

    input.invalid {
        border-color: var(--esb-error);
    }

    .field-hint {
        font-size: 0.78rem;
        color: var(--esb-error);
        margin-top: 6px;
        min-height: 1em;
    }

    button[type=submit] {
        width: 100%;
        margin-top: 8px;
        padding: 13px 20px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        background: linear-gradient(to right, #148ae1, #00cfab);
        transition: filter 0.15s ease, transform 0.1s ease;
    }

    button[type=submit]:hover { filter: brightness(1.05); }
    button[type=submit]:active { transform: scale(0.98); }

    button[type=submit]:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        filter: none;
    }

    .footer-note {
        text-align: center;
        font-size: 0.75rem;
        color: var(--esb-text-muted);
        margin-top: 24px;
    }
</style>
</head>

        <h1>Registrasi Jira U Bot</h1>
        <p class="subtitle">Daftar supaya reminder Code Process kamu dipersonalisasi dengan nama kamu.</p>

        {{if .Error}}
        <div class="alert" role="alert">
            <span>⚠️</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <form method="POST" action="/esb-jira-notif/register" id="register-form" novalidate>
            <div class="field">
                <label for="name">Nama</label>
                <input type="text" id="name" name="name" required autocomplete="name">
                <div class="field-hint" id="name-hint"></div>
            </div>

            <div class="field">
                <label for="email">Email Jira (esb.co.id)</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="nama@esb.co.id">
                <div class="field-hint" id="email-hint"></div>
            </div>

            <button type="submit" id="submit-btn">Daftar</button>
        </form>

        <p class="footer-note">ESB &middot; Jira Notification Bot</p>
    </div>

    <script>
        (function () {
            var form = document.getElementById('register-form');
            var nameInput = document.getElementById('name');
            var emailInput = document.getElementById('email');
            var emailHint = document.getElementById('email-hint');
            var nameHint = document.getElementById('name-hint');
            var submitBtn = document.getElementById('submit-btn');
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function validateEmail() {
                var value = emailInput.value.trim();
                var valid = value === '' || emailPattern.test(value);
                emailInput.classList.toggle('invalid', !valid);
                emailHint.textContent = valid ? '' : 'Format email tidak valid';
                return valid && value !== '';
            }

            function validateName() {
                var valid = nameInput.value.trim() !== '';
                nameInput.classList.toggle('invalid', !valid);
                return valid;
            }

            emailInput.addEventListener('blur', validateEmail);
            emailInput.addEventListener('input', function () {
                if (emailInput.classList.contains('invalid')) validateEmail();
            });
            nameInput.addEventListener('blur', validateName);
            nameInput.addEventListener('input', function () {
                if (nameInput.classList.contains('invalid')) validateName();
            });

            form.addEventListener('submit', function (e) {
                var nameOk = validateName();
                var emailOk = validateEmail();
                if (!nameOk || !emailOk) {
                    e.preventDefault();
                    return;
                }
                submitBtn.disabled = true;
                submitBtn.textContent = 'Memproses...';
            });
        })();
    </script>
</body>
