<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Jira U Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=REM:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --blue: #1286e1;
        --blue-dark: #0e65a9;
        --blue-darker: #094371;
        --blue-light: #eaf5ff;
        --text: #333333;
        --text-muted: #6c6c6c;
        --border: #e6e6e6;
        --error: #b91c1c;
        --error-bg: #fdecec;
        --jira-blue: #0052cc;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'REM', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top left, var(--blue-light), #ffffff 55%);
    }

    .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 24px;
        padding: 40px 36px;
        box-shadow: 0 20px 45px -15px rgba(9, 67, 113, 0.18);
        border: 1px solid var(--border);
        opacity: 0;
        transform: translateY(12px);
        animation: card-in 0.5s ease forwards;
        text-align: center;
    }

    @keyframes card-in {
        to { opacity: 1; transform: translateY(0); }
    }

    .logo {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
    }

    .logo-badge {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #2684ff, var(--jira-blue));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 24px -10px rgba(0, 82, 204, 0.5);
    }

    .logo-badge svg { width: 30px; height: 30px; }

    .bot-badge {
        position: absolute;
        bottom: -6px;
        right: -6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        line-height: 1;
    }

    h1 {
        font-size: 1.4rem;
        font-weight: 700;
        text-align: center;
        margin: 0 0 8px;
        color: var(--blue-darker);
    }

    .subtitle {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 0 0 28px;
        line-height: 1.5;
    }

    .alert {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        text-align: left;
        background: var(--error-bg);
        color: var(--error);
        border: 1px solid #f3c6c6;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        line-height: 1.4;
    }

    .google-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-top: 8px;
        padding: 13px 20px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        text-decoration: none;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        background: linear-gradient(to right, #148ae1, #00cfab);
        transition: filter 0.15s ease, transform 0.1s ease;
    }

    .google-btn:hover { filter: brightness(1.05); }
    .google-btn:active { transform: scale(0.98); }

    .footer-note {
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 24px;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.571 11.513H0a5.218 5.218 0 0 0 5.232 5.215h2.13v2.057A5.215 5.215 0 0 0 12.575 24V12.518a1.005 1.005 0 0 0-1.005-1.005zm5.723-5.756H5.736a5.215 5.215 0 0 0 5.215 5.214h2.129v2.058a5.218 5.218 0 0 0 5.215 5.214V6.758a1.001 1.001 0 0 0-1.001-1.001zM23.013 0H11.455a5.215 5.215 0 0 0 5.215 5.215h2.129v2.057A5.215 5.215 0 0 0 24 12.483V1.005A1.001 1.001 0 0 0 23.013 0Z"/>
                </svg>
                <span class="bot-badge" aria-hidden="true">🤖</span>
            </div>
        </div>

        <h1>Jira U Bot Dashboard</h1>
        <p class="subtitle">Login pakai akun Google kantor (@esb.co.id) untuk lihat tiket, atur reminder, dan lainnya.</p>

        {{if .Error}}
        <div class="alert" role="alert">
            <span>⚠️</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <a class="google-btn" href="{{.BasePath}}/auth/google/login">Sign in with Google</a>

        <p class="footer-note">Khusus email @esb.co.id</p>
    </div>
</body>
</html>
