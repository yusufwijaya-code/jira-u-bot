<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdue - Jira U Bot</title>
<link href="https://fonts.googleapis.com/css2?family=REM:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root { --blue-dark:#0e65a9; --text:#333; --text-muted:#6c6c6c; --border:#e6e6e6; --bg:#f7fafc; --error:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'REM',ui-sans-serif,system-ui,sans-serif; color:var(--text); background:var(--bg); }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:#fff; border-bottom:1px solid var(--border); }
    header .brand { font-weight:700; color:var(--blue-dark); }
    header nav a { color:var(--text-muted); text-decoration:none; margin-left:16px; font-size:0.9rem; }
    main { max-width:900px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid var(--border); border-left:4px solid var(--error); border-radius:10px; padding:14px 16px; margin-bottom:10px; font-size:0.85rem; }
    .card .key { font-weight:700; color:var(--blue-dark); }
    .card .assignee { color:var(--text-muted); }
    .card .budget { color:var(--error); font-size:0.78rem; margin-top:6px; }
    .empty { color:var(--text-muted); text-align:center; padding:40px; }
</style>
</head>
<body>
<header>
    <span class="brand">🤖 Jira U Bot Dashboard</span>
    <nav>
        <span>{{.Email}}</span>
        <a href="{{.BasePath}}/dashboard">My Board</a>
        <a href="{{.BasePath}}/dashboard/team">Team</a>
        <a href="{{.BasePath}}/auth/logout">Logout</a>
    </nav>
</header>
<main>
    {{if not .Items}}
    <p class="empty">Semua tiket masih dalam budget 🎉</p>
    {{else}}
    {{range .Items}}
    <div class="card">
        <span class="key">{{.IssueKey}}</span> — {{.Summary}} <span class="assignee">({{.AssigneeEmail}})</span>
        {{if .HasBudgetDetail}}<div class="budget">{{.StoryPoints}} SP · elapsed {{.ElapsedLabel}} · lewat budget</div>{{end}}
    </div>
    {{end}}
    {{end}}
</main>
</body>
</html>
